name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install & Fix Dependencies
      run: |
        npm install
        npm audit fix --force  # Automatically patches the high/critical vulnerabilities

    - name: Sync & Prepare Capacitor Android
      run: |
        # 1. Clear out pre-existing local android directories to prevent collisions
        rm -rf android
        
        # 2. Initialize with non-interactive parameters explicitly passed
        npx cap init "Teams Desktop PWA" "com.custom.teamsdesktop" --web-dir=www
        
        # 3. Freshly construct the platform wrapper
        npx cap add android
        npx cap sync android

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Compile and Bundle APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teams-desktop-pwa-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
