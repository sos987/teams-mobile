            // ---- Navigation handling + load-error diagnostics -------------------------------------------------------
            // Keeps a short trail of navigations (query strings stripped, they can contain tokens) and, if the page
            // cannot be loaded, shows the real error plus that trail instead of Android's generic error page.
            private final ArrayList<String> navTrail = new ArrayList<>();
            private boolean loadedOnce = false;

            private void trail(String entry) {
                synchronized (navTrail) {
                    navTrail.add(entry);
                    while (navTrail.size() > 30) navTrail.remove(0);
                }
            }

            private static String stripQuery(String url) {
                try {
                    Uri u = Uri.parse(url);
                    String path = u.getPath();
                    return u.getScheme() + "://" + u.getHost() + (path == null ? "" : path);
                } catch (Exception e) {
                    return "?";
                }
            }

            private static String esc(String s) {
                if (s == null) return "";
                return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;");
            }

            private void showErrorPage(final WebView view, String title, String detail) {
                final StringBuilder sb = new StringBuilder();
                sb.append("<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>")
                  .append("<body style='background:#1f1f1f;color:#ddd;font-family:sans-serif;padding:16px'>")
                  .append("<h2>").append(esc(title)).append("</h2>")
                  .append("<p style='word-break:break-all;white-space:pre-wrap'>").append(esc(detail)).append("</p>")
                  .append("<p><a style='color:#8ab4f8;font-size:20px' href='https://teams.cloud.microsoft/'>Retry</a></p>")
                  .append("<h3>Navigation trail</h3><pre style='white-space:pre-wrap;word-break:break-all;font-size:12px'>");
                synchronized (navTrail) {
                    for (String t : navTrail) sb.append(esc(t)).append("\n");
                }
                sb.append("</pre></body></html>");
                view.post(new Runnable() {
                    @Override
                    public void run() {
                        view.loadDataWithBaseURL(null, sb.toString(), "text/html", "utf-8", null);
                    }
                });
            }

            private void installNavigationClient() {
                try {
                    bridge.getWebView().setWebViewClient(new BridgeWebViewClient(bridge) {
                        @Override
                        public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                            boolean redirect = Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && request.isRedirect();
                            trail((redirect ? "redirect " : "navigate ") + (request.isForMainFrame() ? "" : "(subframe) ")
                                + stripQuery(request.getUrl().toString()));
                            // Links in invitations/mails are often wrapped in Safe Links: open the real target (in the app if it is Microsoft)
                            if (request.isForMainFrame() && !redirect && isSafeLink(request.getUrl().toString())) {
                                routeLink(view, request.getUrl().toString());
                                return true;
                            }
                            // Never abort a server redirect of the main page (sign-in chains)
                            if (request.isForMainFrame() && redirect) return false;
                            return super.shouldOverrideUrlLoading(view, request);
                        }

                        @Override
                        public void onPageStarted(WebView view, String url, Bitmap favicon) {
                            trail("started " + stripQuery(url));
                            super.onPageStarted(view, url, favicon);
                        }

                        @Override
                        public void onPageFinished(WebView view, String url) {
                            if (url != null && url.startsWith("https://")) loadedOnce = true;
                            super.onPageFinished(view, url);
                        }

                        @Override
                        public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && request.isForMainFrame()) {
                                String detail = "Code " + error.getErrorCode() + ": " + error.getDescription()
                                    + "\nURL: " + stripQuery(request.getUrl().toString());
                                trail("ERROR " + detail.replace("\n", " | "));
                                showErrorPage(view, "Page could not be loaded", detail);
                                return;
                            }
                            super.onReceivedError(view, request, error);
                        }

                        @Override
                        public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                            if (request.isForMainFrame()) {
                                trail("HTTP " + errorResponse.getStatusCode() + " " + stripQuery(request.getUrl().toString()));
                            }
                            super.onReceivedHttpError(view, request, errorResponse);
                        }

                        @Override
                        public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                            String detail = "SSL error " + error.getPrimaryError()
                                + " (0 not yet valid, 1 expired, 2 hostname mismatch, 3 untrusted, 4 bad date, 5 invalid)"
                                + "\nURL: " + stripQuery(error.getUrl());
                            SslCertificate cert = error.getCertificate();
                            if (cert != null) {
                                detail += "\nIssued by: " + cert.getIssuedBy().getDName()
                                    + "\nIssued to: " + cert.getIssuedTo().getCName();
                            }
                            trail("SSL " + detail.replace("\n", " | "));
                            handler.cancel(); // never proceed past certificate errors
                            if (!loadedOnce) showErrorPage(view, "Secure connection failed", detail);
                        }
                    });
                } catch (Throwable ignored) {
                    // fall back to Capacitor's default WebViewClient
                }
            }

            // The desktop user-agent must carry the SAME Chrome major version as the WebView that is actually installed.
            // WebView auto-updates (every ~2 weeks now), so a hardcoded version goes stale and servers can reject the mismatch.
            private static final String START_URL = "https://teams.cloud.microsoft";

            private String chromeMajor() {
                try {
                    Matcher m = Pattern.compile("Chrome/(\\d+)").matcher(WebSettings.getDefaultUserAgent(this));
                    if (m.find()) return m.group(1);
                } catch (Throwable ignored) {
                    // keep fallback
                }
                return "157";
            }

            private String buildDesktopUserAgent() {
                return "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/" + chromeMajor() + ".0.0.0 Safari/537.36";
            }

            private boolean nativeHintsApplied = false;

            // The Sec-CH-UA* request headers (and navigator.userAgentData) otherwise still say "Android WebView / mobile / Android",
            // which contradicts the desktop user-agent. We start from the WebView's REAL metadata (so the version numbers, the
            // GREASE brand and the brand order are exactly what Chrome of this version generates) and only change what a
            // desktop Chrome would say differently: "Android WebView" -> "Google Chrome", platform Linux, not mobile.
            private boolean applyDesktopClientHints(WebView wv) {
                try {
                    if (!WebViewFeature.isFeatureSupported(WebViewFeature.USER_AGENT_METADATA)) return false;
                    UserAgentMetadata cur = WebSettingsCompat.getUserAgentMetadata(wv.getSettings());
                    List<UserAgentMetadata.BrandVersion> brands = new ArrayList<>();
                    for (UserAgentMetadata.BrandVersion b : cur.getBrandVersionList()) {
                        String name = "Android WebView".equals(b.getBrand()) ? "Google Chrome" : b.getBrand();
                        brands.add(new UserAgentMetadata.BrandVersion.Builder()
                            .setBrand(name)
                            .setMajorVersion(b.getMajorVersion())
                            .setFullVersion(b.getFullVersion())
                            .build());
                    }
                    UserAgentMetadata metadata = new UserAgentMetadata.Builder()
                        .setBrandVersionList(brands)
                        .setFullVersion(cur.getFullVersion())
                        .setPlatform("Linux")
                        .setPlatformVersion("6.5.0")
                        .setArchitecture("x86")
                        .setBitness(64)
                        .setModel("")
                        .setMobile(false)
                        .setWow64(false)
                        .build();
                    WebSettingsCompat.setUserAgentMetadata(wv.getSettings(), metadata);
                    return true;
                } catch (Throwable ignored) {
                    return false; // the page script will fake navigator.userAgentData instead
                }
            }

            // Must run before installPageHooks() (which needs to know whether the native hints are in place).
            private void setDesktopIdentity() {
                try {
                    WebView wv = bridge.getWebView();
                    wv.getSettings().setUserAgentString(buildDesktopUserAgent());
                    nativeHintsApplied = applyDesktopClientHints(wv);
                } catch (Throwable ignored) {
                    // keep whatever identity is set
                }
            }

            // The first request may already have gone out with the previous identity: restart it with the new one.
            private void restartStartPage() {
                try {
                    WebView wv = bridge.getWebView();
                    wv.stopLoading();
                    wv.loadUrl(START_URL);
                } catch (Throwable ignored) {
                    // nothing to do
                }
            }

            private String pageHooksJs = null;

            private String readAsset(String name) {
                try (InputStream in = getAssets().open(name); ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                    byte[] buf = new byte[4096];
                    int n;
                    while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                    return out.toString("UTF-8");
                } catch (Exception e) {
                    return null;
                }
            }

            // Injects assets/page-hooks.js at the very start of every page/frame load (before Teams' own scripts run).
            private boolean installPageHooks() {
                try {
                    pageHooksJs = readAsset("page-hooks.js");
                    if (pageHooksJs == null) return false;
                    pageHooksJs = pageHooksJs.replace("__NATIVE_UACH__", String.valueOf(nativeHintsApplied));
                    if (!WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) return false;
                    WebViewCompat.addDocumentStartJavaScript(bridge.getWebView(), pageHooksJs, Collections.singleton("*"));
                    return true;
                } catch (Throwable ignored) {
                    return false;
                }
            }

            private boolean has(String permission) {
                return ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED;
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                // "Quit" button of the background notification
                if (getIntent() != null && TeamsForegroundService.ACTION_QUIT.equals(getIntent().getAction())) {
                    stopService(new Intent(this, TeamsForegroundService.class));
                    finishAndRemoveTask();
                    return;
                }

                // Android Back: close dialogs / go back in Teams instead of closing the app
                getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                    @Override
                    public void handleOnBackPressed() {
                        handleBack();
                    }
                });

                // Keep the focused field visible above the keyboard (helps password autofill)
                getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);

                // Ask for camera/mic up-front, so they are already granted when Teams probes devices.
                List<String> missing = new ArrayList<>();
                if (!has(Manifest.permission.CAMERA)) missing.add(Manifest.permission.CAMERA);
                if (!has(Manifest.permission.RECORD_AUDIO)) missing.add(Manifest.permission.RECORD_AUDIO);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !has(Manifest.permission.BLUETOOTH_CONNECT)) {
                    missing.add(Manifest.permission.BLUETOOTH_CONNECT);
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && !has(Manifest.permission.POST_NOTIFICATIONS)) {
                    missing.add(Manifest.permission.POST_NOTIFICATIONS);
                }
                if (!missing.isEmpty()) {
                    permissionRequestInFlight = true;
                    ActivityCompat.requestPermissions(this, missing.toArray(new String[0]), MEDIA_PERMISSION_REQUEST);
                }

                installMediaPermissionClient();
                installNavigationClient();
                setDesktopIdentity();
                installPageHooks();
                installNativeBridge();
                restartStartPage();
                startBackgroundService();

                this.bridge.getWebView().post(new Runnable() {
                    @Override
                    public void run() {
                        final WebView webView = bridge.getWebView();
                        WebSettings settings = webView.getSettings();

                        settings.setJavaScriptEnabled(true);
                        settings.setDomStorageEnabled(true);
                        settings.setSupportMultipleWindows(true); // links that open a new window are routed by onCreateWindow
                        settings.setDatabaseEnabled(true);
                        settings.setSavePassword(true);
                        settings.setSaveFormData(true);

                        // Use the system autofill framework (Google / Samsung / Bitwarden...) for login fields
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                            webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);
                        }
                        webView.setFocusable(true);
                        webView.setFocusableInTouchMode(true);

                        // Let remote call audio / ringtones play without a tap
                        settings.setMediaPlaybackRequiresUserGesture(false);

                        CookieManager cookieManager = CookieManager.getInstance();
                        cookieManager.setAcceptCookie(true);
                        cookieManager.setAcceptThirdPartyCookies(webView, true);
                        cookieManager.flush();

                        final String heavyCSSInjection =
                            "(function() {" +
                            "  var id = 'custom-teams-margins';" +
                            "  if (document.getElementById(id)) return;" +
                            "  var style = document.createElement('style');" +
                            "  style.id = id;" +
                            "  style.type = 'text/css';" +
                            "  style.innerHTML = '" +
                            (COMPACT_ZOOM ? "    body, html, #app-container, .app-width, #main-layout-id { zoom: 0.85 !important; }" : "") +
                            "    .v2-left-rail, [data-test-id=\"left-rail\"], div[class*=\"leftRail\"] {" +
                            "      width: 50px !important; min-width: 50px !important;" +
                            "    }" +
                            "    .download-app-banner, .mobile-promo { display: none !important; }" +
                            "  ';" +
                            "  document.head.appendChild(style);" +
                            "})();";

                        final Handler handler = new Handler(Looper.getMainLooper());
                        for (int i = 0; i < 10; i++) {
                            handler.postDelayed(new Runnable() {
                                @Override
                                public void run() {
                                    webView.evaluateJavascript(heavyCSSInjection, null);
                                }
                            }, i * 1500);
                        }

                        // Fallback for the very first page load (document-start script may miss it): inject the same
                        // idempotent script a few times during the first 30 s.
                        if (pageHooksJs != null) {
                            for (int k = 1; k <= 10; k++) {
                                handler.postDelayed(new Runnable() {
                                    @Override
                                    public void run() {
                                        webView.evaluateJavascript(pageHooksJs, null);
                                    }
                                }, k * 3000);
                            }
                        }

                    }
                });
            }

            // ---- Links, native bridge (notifications / calls) ------------------------------------------------------

            private static boolean isMicrosoftHost(String host) {
                if (host == null) return false;
                String h = host.toLowerCase();
                String[] suffixes = {
                    "microsoft.com", "microsoft", "microsoftonline.com", "office.com", "office365.com", "live.com",
                    "skype.com", "sharepoint.com", "microsoft365.com", "cloud.microsoft", "msauth.net", "msftauth.net"
                };
                for (String s : suffixes) {
                    if (h.equals(s) || h.endsWith("." + s)) return true;
                }
                return false;
            }

            private static boolean isSafeLink(String url) {
                try {
                    String host = Uri.parse(url).getHost();
                    return host != null && host.toLowerCase().endsWith("safelinks.protection.outlook.com");
                } catch (Exception e) {
                    return false;
                }
            }

            private static String unwrapSafeLink(String url) {
                try {
                    if (isSafeLink(url)) {
                        String real = Uri.parse(url).getQueryParameter("url");
                        if (real != null && !real.isEmpty()) return real;
                    }
                } catch (Exception ignored) {
                    // use the link as it is
                }
                return url;
            }

            private void openExternally(String url) {
                try {
                    startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                } catch (Exception e) {
                    Toast.makeText(this, "No app can open this link", Toast.LENGTH_SHORT).show();
                }
            }

            // Microsoft pages (Teams, live events, meeting joins) open inside the app, everything else in the browser.
            private void routeLink(WebView main, String url) {
                String target = unwrapSafeLink(url);
                Uri uri = Uri.parse(target);
                String scheme = uri.getScheme();
                boolean web = "https".equals(scheme) || "http".equals(scheme);
                if (web && isMicrosoftHost(uri.getHost())) {
                    main.loadUrl(target);
                } else {
                    openExternally(target);
                }
            }

            // Lets the Teams page (only the Teams origins) talk to the app: call state and notifications.
            private void installNativeBridge() {
                try {
                    if (!WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) return;
                    Set<String> origins = new HashSet<>(Arrays.asList("https://teams.cloud.microsoft", "https://teams.microsoft.com"));
                    WebViewCompat.addWebMessageListener(bridge.getWebView(), "TeamsNative", origins,
                        new WebViewCompat.WebMessageListener() {
                            @Override
                            public void onPostMessage(WebView view, WebMessageCompat message, Uri sourceOrigin,
                                                      boolean isMainFrame, JavaScriptReplyProxy replyProxy) {
                                handleNativeMessage(message.getData());
                            }
                        });
                } catch (Throwable ignored) {
                    // calls and notifications then simply behave like before
                }
            }

            private void handleNativeMessage(String data) {
                if (data == null) return;
                try {
                    JSONObject message = new JSONObject(data);
                    String type = message.optString("type");
                    if ("call".equals(type)) {
                        TeamsForegroundService.send(this, message.optBoolean("active")
                            ? TeamsForegroundService.ACTION_CALL_ON : TeamsForegroundService.ACTION_CALL_OFF);
                    } else if ("debug".equals(type)) {
                        Toast.makeText(this, "Teams: " + message.optString("text"), Toast.LENGTH_SHORT).show();
                    } else if ("notify".equals(type) && !inForeground) {
                        TeamsForegroundService.showMessage(this, message.optString("title"), message.optString("body"), message.optString("tag"));
                    }
                } catch (Exception ignored) {
                    // malformed message
                }
            }

            private void startBackgroundService() {
                try {
                    TeamsForegroundService.keepAlive = KEEP_ALIVE_IN_BACKGROUND;
                    if (KEEP_ALIVE_IN_BACKGROUND) {
                        TeamsForegroundService.send(this, TeamsForegroundService.ACTION_START);
                    }
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        // keep the page's renderer at full priority while the app is in the background
                        bridge.getWebView().setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
                    }
                } catch (Throwable ignored) {
                    // background mode is best-effort
                }
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == MEDIA_PERMISSION_REQUEST) {
                    permissionRequestInFlight = false;
                    // Teams probed devices before the permissions existed, so make it probe again
                    if (has(Manifest.permission.CAMERA) || has(Manifest.permission.RECORD_AUDIO)) {
                        bridge.getWebView().reload();
                    }
                }
            }

            @Override
            public void onResume() {
                super.onResume();
                inForeground = true;
            }

            @Override
            public void onPause() {
                super.onPause();
                inForeground = false;
                CookieManager.getInstance().flush();
            }

            @Override
            public void onNewIntent(Intent intent) {
                super.onNewIntent(intent);
                if (intent != null && TeamsForegroundService.ACTION_QUIT.equals(intent.getAction())) {
                    stopService(new Intent(this, TeamsForegroundService.class));
                    finishAndRemoveTask();
                }
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                if (isFinishing()) {
                    stopService(new Intent(this, TeamsForegroundService.class));
                }
            }

            @Override
            public void onStop() {
                super.onStop();
                persistSessionCookies();
            }
        }
        EOF

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign APK Natively using Android SDK Tools
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
        ZIPALIGN_PATH=$(find $ANDROID_HOME/build-tools/ -name zipalign | sort -V | tail -n 1)
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
        $ZIPALIGN_PATH -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk teams-aligned.apk
        $APKSIGNER_PATH sign --ks release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out teams-desktop-pwa-release.apk teams-aligned.apk
        rm release.jks

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teams-desktop-pwa-release-signed-apk
        path: teams-desktop-pwa-release.apk
