name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install

    - name: Generate Native Android Project Fresh
      run: |
        rm -rf android
        mkdir -p www
        echo '<!DOCTYPE html><html><head><title>Teams</title></head><body>Loading...</body></html>' > www/index.html
        npx cap init "Teams Desktop PWA" "com.custom.teamsdesktop" --web-dir=www
        npx cap add android
        npx cap sync android

    - name: Inject Custom MainActivity Java Code
      run: |
        cat << 'EOF' > android/app/src/main/java/com/custom/teamsdesktop/MainActivity.java
        package com.custom.teamsdesktop;

        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.view.View;
        import androidx.core.view.ViewCompat;
        import androidx.core.view.WindowInsetsCompat;
        import android.webkit.CookieManager;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                // 1. Definitively solve status bar overlap using Native Window Insets padding
                ViewCompat.setOnApplyWindowInsetsListener(findViewById(android.R.id.content), (v, insets) -> {
                    int statusBarHeight = insets.getInsets(WindowInsetsCompat.Type.statusBars()).top;
                    int navigationBarHeight = insets.getInsets(WindowInsetsCompat.Type.navigationBars()).bottom;
                    
                    // Pad the root view container so web layout stays perfectly inside safe screen bounds
                    v.setPadding(0, statusBarHeight, 0, navigationBarHeight);
                    return insets;
                });

                this.bridge.getWebView().post(new Runnable() {
                    @Override
                    public void run() {
                        final WebView webView = bridge.getWebView();
                        WebSettings settings = webView.getSettings();
                        
                        String desktopUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
                        settings.setUserAgentString(desktopUA);
                        
                        // Enable aggressive persistent cookie storage infrastructure
                        settings.setJavaScriptEnabled(true);
                        settings.setDomStorageEnabled(true);
                        settings.setDatabaseEnabled(true);
                        settings.setSavePassword(true);
                        
                        CookieManager cookieManager = CookieManager.getInstance();
                        cookieManager.setAcceptCookie(true);
                        cookieManager.setAcceptThirdPartyCookies(webView, true);

                        // Layout Scaling Adjustments
                        final String heavyCSSInjection = 
                            "(function() {" +
                            "  var id = 'custom-teams-margins';" +
                            "  if (document.getElementById(id)) return;" +
                            "  var style = document.createElement('style');" +
                            "  style.id = id;" +
                            "  style.type = 'text/css';" +
                            "  style.innerHTML = '" +
                            "    body, html, #app-container, .app-width, #main-layout-id { zoom: 0.85 !important; }" +
                            "    .v2-left-rail, [data-test-id=\"left-rail\"], div[class*=\"leftRail\"] {" +
                            "      width: 50px !important; min-width: 50px !important;" +
                            "    }" +
                            "    .download-app-banner, .mobile-promo { display: none !important; }" +
                            "  ';" +
                            "  document.head.appendChild(style);" +
                            "})();";

                        final Handler handler = new Handler(Looper.getMainLooper());
                        for (int i = 0; i < 10; i++) {
                            handler.postDelayed(new Runnable() {
                                @Override
                                public void run() {
                                    webView.evaluateJavascript(heavyCSSInjection, null);
                                }
                            }, i * 1500);
                        }
                    }
                });
            }

            // 2. Fixed access modifier compilation conflict (changed from protected to public)
            @Override
            public void onPause() {
                super.onPause();
                CookieManager.getInstance().flush(); // Synchronize login cookies to device disk immediately
            }
        }
        EOF

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        alias: ${{ secrets.ANDROID_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teams-desktop-pwa-release-signed-apk
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
