name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install

    - name: Ensure Android Platform Exists and Sync
      run: |
        # Проверяем, существует ли папка android. Если нет — инициализируем и создаем её с нуля.
        if [ ! -d "android" ]; then
          echo "Папка android отсутствует. Инициализируем платформу..."
          npx cap init "Teams Desktop PWA" "com.custom.teamsdesktop" --web-dir=www --no-interactive
          npx cap add android
        fi
        npx cap sync android

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        alias: ${{ secrets.ANDROID_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teams-desktop-pwa-release-signed-apk
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
