name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install

    - name: Generate Native Android Project Fresh
      run: |
        # 1. Clear out any pre-existing broken android folder tracks to prevent collisions
        rm -rf android
        
        # 2. Setup the dummy web assets folder required structurally by the engine
        mkdir -p www
        echo '<!DOCTYPE html><html><head><title>Teams</title></head><body>Loading...</body></html>' > www/index.html
        
        # 3. Initialize the tool configuration properties mapping
        npx cap init "Teams Desktop PWA" "com.custom.teamsdesktop" --web-dir=www
        
        # 4. Generate the complete android platform directory framework including gradlew files
        npx cap add android
        npx cap sync android

    - name: Add Camera / Microphone / Audio Permissions to AndroidManifest
      run: |
        MANIFEST=android/app/src/main/AndroidManifest.xml

        # Runtime-requestable permissions. Capacitor's WebChromeClient asks the user for
        # CAMERA / RECORD_AUDIO when Teams calls getUserMedia(), but only if they are declared here.
        # BLUETOOTH_CONNECT is needed on Android 12+ to route call audio to BT headsets.
        sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>#' "$MANIFEST"

        echo "---- Resulting manifest ----"
        cat "$MANIFEST"
        grep -q "android.permission.RECORD_AUDIO" "$MANIFEST" || { echo "Manifest patch failed"; exit 1; }

    - name: Add Page Hooks Script and androidx.webkit Dependency
      run: |
        # JS that runs at document start in every frame: media/permission hooks + client-hints fix (needs androidx.webkit)
        mkdir -p android/app/src/main/assets
        cat << 'JSEOF' > android/app/src/main/assets/page-hooks.js
        (function () {
          'use strict';
          if (window.__teamsHooks) return;
          window.__teamsHooks = true;

          var IS_TOP = (window === window.top);
          var FAKE_GRANTED = true;  // report camera/microphone permission as 'granted' (WebView always says 'prompt')
          var SPOOF_UACH = true;    // make navigator.userAgentData match the desktop Linux Chrome user-agent
          var SHOW_TRACE = true;    // TEMPORARY yellow debug strip at the bottom of the screen

          function short(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + '..' : s; }

          // ---------- trace strip ----------
          var lines = [];
          function render() {
            if (!IS_TOP || !SHOW_TRACE) return;
            var host = document.body || document.documentElement;
            if (!host) return;
            var p = document.getElementById('media-log');
            if (!p) {
              p = document.createElement('pre');
              p.id = 'media-log';
              p.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:rgba(0,0,0,.85);color:#ff0;font:10px monospace;padding:6px;margin:0;white-space:pre-wrap;max-height:38%;overflow:hidden;pointer-events:none;';
              host.appendChild(p);
            }
            p.textContent = lines.slice(-10).join('\n');
          }
          function push(line) {
            if (lines.length && lines[lines.length - 1] === line) return;
            lines.push(line);
            render();
          }
          function log(msg) {
            var line = (IS_TOP ? '' : '[' + short(location.host || 'frame', 18) + '] ') + msg;
            if (IS_TOP) push(line);
            else { try { window.top.postMessage({ __tlog: line }, '*'); } catch (e) {} }
          }
          if (IS_TOP) {
            window.addEventListener('message', function (ev) {
              var d = ev.data;
              if (d && typeof d === 'object' && d.__tlog) push(String(d.__tlog));
            });
            document.addEventListener('DOMContentLoaded', render);
          }

          // ---------- media API hooks (installed on prototypes, so references captured later still go through) ----------
          try {
            var MD = window.MediaDevices && window.MediaDevices.prototype;
            if (MD && MD.getUserMedia) {
              var ogum = MD.getUserMedia;
              MD.getUserMedia = function (c) {
                log('gUM ' + short(JSON.stringify(c), 100));
                return ogum.apply(this, arguments).then(function (s) {
                  log('  OK ' + s.getTracks().map(function (t) { return t.kind[0] + ':' + t.readyState; }).join(','));
                  return s;
                }, function (e) {
                  log('  ERR ' + e.name + ': ' + short(e.message, 60));
                  throw e;
                });
              };
            }
            if (MD && MD.enumerateDevices) {
              var oenum = MD.enumerateDevices;
              MD.enumerateDevices = function () {
                return oenum.apply(this, arguments).then(function (d) {
                  log('enum ' + d.map(function (x) { return x.kind.slice(0, 2) + (x.deviceId ? '' : '!id') + (x.label ? '' : '!lbl'); }).join(' '));
                  return d;
                });
              };
            }
          } catch (e) {}

          try {
            var P = window.Permissions && window.Permissions.prototype;
            if (P && P.query) {
              var oq = P.query;
              P.query = function (d) {
                var name = d && d.name;
                var media = (name === 'microphone' || name === 'camera');
                return oq.apply(this, arguments).then(function (r) {
                  var real = r.state;
                  if (FAKE_GRANTED && media) {
                    try { Object.defineProperty(r, 'state', { get: function () { return 'granted'; } }); } catch (e) {}
                  }
                  log('perm ' + name + '=' + real + (FAKE_GRANTED && media ? '->granted' : ''));
                  return r;
                }, function (e) {
                  log('perm ' + name + ' ERR ' + e.name);
                  throw e;
                });
              };
            }
          } catch (e) {}

          window.addEventListener('unhandledrejection', function (ev) {
            var r = ev.reason || {};
            var t = (r.name || '') + ' ' + (r.message || r);
            if (/NotAllowed|NotFound|Overconstrained|NotReadable|Permission|device/i.test(t)) log('REJECT ' + short(t, 100));
          });

          // ---------- client hints: stop advertising "Android WebView / mobile" to page scripts ----------
          if (SPOOF_UACH) {
            try {
              var brands = [{ brand: 'Chromium', version: '155' }, { brand: 'Google Chrome', version: '155' }, { brand: 'Not A(Brand)', version: '99' }];
              var full = [{ brand: 'Chromium', version: '155.0.0.0' }, { brand: 'Google Chrome', version: '155.0.0.0' }, { brand: 'Not A(Brand)', version: '99.0.0.0' }];
              var uad = {
                brands: brands, mobile: false, platform: 'Linux',
                getHighEntropyValues: function () {
                  return Promise.resolve({ brands: brands, mobile: false, platform: 'Linux', platformVersion: '6.5.0', architecture: 'x86', bitness: '64', model: '', uaFullVersion: '155.0.0.0', fullVersionList: full, wow64: false });
                },
                toJSON: function () { return { brands: brands, mobile: false, platform: 'Linux' }; }
              };
              Object.defineProperty(Navigator.prototype, 'userAgentData', { get: function () { return uad; }, configurable: true });
            } catch (e) {}
          }

          log('hooks on (' + (IS_TOP ? 'top' : 'frame') + ')');
        })();
        JSEOF

        GRADLE=android/app/build.gradle
        sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.webkit:webkit:1.12.1"/' "$GRADLE"
        grep -n "androidx.webkit" "$GRADLE" || { echo "Could not add androidx.webkit dependency"; exit 1; }

    - name: Inject Custom MainActivity Java Code
      run: |
        # Inject the custom UI header margins logic and persistent session sync rules with Linux User-Agent
        cat << 'EOF' > android/app/src/main/java/com/custom/teamsdesktop/MainActivity.java
        package com.custom.teamsdesktop;

        import android.Manifest;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.util.Log;
        import android.view.View;
        import android.view.WindowManager;
        import android.webkit.CookieManager;
        import android.webkit.PermissionRequest;
        import android.webkit.ValueCallback;
        import android.webkit.WebBackForwardList;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.widget.Toast;
        import androidx.activity.OnBackPressedCallback;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import androidx.webkit.WebViewCompat;
        import androidx.webkit.WebViewFeature;
        import com.getcapacitor.BridgeActivity;
        import com.getcapacitor.BridgeWebChromeClient;
        import java.io.ByteArrayOutputStream;
        import java.io.InputStream;
        import java.util.ArrayList;
        import java.util.Collections;
        import java.util.List;

        public class MainActivity extends BridgeActivity {
            private static final int MEDIA_PERMISSION_REQUEST = 4242;
            private boolean permissionRequestInFlight = false;

            // Closes the top-most dialog/panel in Teams by sending Escape. Returns true if one was found.
            // If the same element is still there on the next press we let Back do something else (no trap).
            private static final String CLOSE_TOP_LAYER_JS =
                "(function(){" +
                "  var els=[].slice.call(document.querySelectorAll('[role=dialog],[role=alertdialog],[aria-modal=true]'))" +
                "    .filter(function(e){return e.offsetParent!==null||getComputedStyle(e).position==='fixed';});" +
                "  var el=els[els.length-1];" +
                "  if(!el){window.__lastBackEl=null;return false;}" +
                "  if(window.__lastBackEl===el){window.__lastBackEl=null;return false;}" +
                "  window.__lastBackEl=el;" +
                "  var t=document.activeElement||document.body;" +
                "  ['keydown','keyup'].forEach(function(type){" +
                "    t.dispatchEvent(new KeyboardEvent(type,{key:'Escape',code:'Escape',keyCode:27,which:27,bubbles:true,cancelable:true}));" +
                "  });" +
                "  return true;" +
                "})()";

            // TEMPORARY diagnostics: shows an overlay with what the page can see (tap it to dismiss).
            private static final boolean DIAG = false;
            private static final String DIAG_JS =
                "(async function(){" +
                "  var out=[];function add(k,v){out.push(k+': '+v);}" +
                "  try{" +
                "    add('url',location.host);" +
                "    add('secureContext',window.isSecureContext);" +
                "    add('UA',navigator.userAgent.slice(0,70));" +
                "    var u=navigator.userAgentData;" +
                "    add('UA-CH',u?JSON.stringify({mobile:u.mobile,platform:u.platform,brands:u.brands.map(function(b){return b.brand;})}):'none');" +
                "    add('platform/touch',navigator.platform+' / '+navigator.maxTouchPoints);" +
                "    add('mediaDevices',!!navigator.mediaDevices);" +
                "    add('RTCPeerConnection',typeof RTCPeerConnection);" +
                "    for (const n of ['microphone','camera']) {" +
                "      try{var r=await navigator.permissions.query({name:n});add('permission '+n,r.state);}catch(e){add('permission '+n,'ERR '+e.name);}" +
                "    }" +
                "    function fmt(d){return d.map(function(x){return x.kind+(x.label?'':'(nolabel)');}).join(', ')||'none';}" +
                "    add('devices before',fmt(await navigator.mediaDevices.enumerateDevices()));" +
                "    for (const c of [{audio:true},{video:true}]) {" +
                "      try{var s=await navigator.mediaDevices.getUserMedia(c);s.getTracks().forEach(function(t){t.stop();});add('getUserMedia '+Object.keys(c)[0],'OK');}" +
                "      catch(e){add('getUserMedia '+Object.keys(c)[0],e.name+': '+e.message);}" +
                "    }" +
                "    add('devices after',fmt(await navigator.mediaDevices.enumerateDevices()));" +
                "  }catch(e){add('FATAL',e.name+': '+e.message);}" +
                "  var old=document.getElementById('diag-overlay');if(old)old.remove();" +
                "  var p=document.createElement('pre');p.id='diag-overlay';" +
                "  p.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483647;background:rgba(0,0,0,.88);color:#0f0;font:11px monospace;padding:8px;margin:0;white-space:pre-wrap;';" +
                "  p.textContent=out.join('\\n')+'\\n(tap to dismiss)';" +
                "  p.onclick=function(){p.remove();};" +
                "  document.body.appendChild(p);" +
                "})();";

            private boolean canGoBackWithinTeams(WebView wv) {
                WebBackForwardList list = wv.copyBackForwardList();
                int idx = list.getCurrentIndex();
                if (idx <= 0) return false;
                String prev = list.getItemAtIndex(idx - 1).getUrl();
                return prev != null && (prev.contains("teams.cloud.microsoft") || prev.contains("teams.microsoft.com"));
            }

            private void handleBack() {
                final WebView wv = bridge.getWebView();
                wv.evaluateJavascript(CLOSE_TOP_LAYER_JS, new ValueCallback<String>() {
                    @Override
                    public void onReceiveValue(String closedSomething) {
                        if ("true".equals(closedSomething)) return;          // 1. a dialog/panel was closed
                        if (canGoBackWithinTeams(wv)) { wv.goBack(); return; } // 2. navigate back inside Teams
                        moveTaskToBack(true);                                  // 3. otherwise minimise, don't kill the session
                    }
                });
            }

            // Android WebView drops *session* cookies (no expiry) when the app process ends, unlike Chrome which restores them.
            // Microsoft sign-in cookies are often session cookies, so we re-save them with an expiry on pause/stop.
            private static final int COOKIE_LIFETIME_SECONDS = 30 * 24 * 3600;
            private static final String[] COOKIE_HOSTS = {
                "login.microsoftonline.com", "login.microsoft.com", "login.live.com",
                "teams.cloud.microsoft", "teams.microsoft.com", "teams.live.com",
                "www.office.com", "outlook.office.com", "outlook.office365.com", "m365.cloud.microsoft"
            };

            private void persistSessionCookies() {
                try {
                CookieManager cm = CookieManager.getInstance();
                for (String host : COOKIE_HOSTS) {
                    String url = "https://" + host + "/";
                    String all = cm.getCookie(url);
                    if (all == null || all.isEmpty()) continue;
                    boolean httpOnly = host.startsWith("login."); // auth cookies are HttpOnly; keep that, JS on Teams hosts may read theirs
                    for (String pair : all.split(";")) {
                        pair = pair.trim();
                        if (pair.indexOf('=') <= 0) continue;
                        cm.setCookie(url, pair + "; Max-Age=" + COOKIE_LIFETIME_SECONDS
                            + "; Path=/; Secure; SameSite=None" + (httpOnly ? "; HttpOnly" : ""));
                    }
                }
                cm.flush();
                } catch (Throwable t) {
                    Log.e("TeamsMobile", "persistSessionCookies failed", t);
                }
            }

            // IMPORTANT: BridgeWebChromeClient registers ActivityResult launchers in its constructor, which Android only
            // allows before the activity is STARTED. So this must run inside onCreate, not in a delayed post().
            private void installMediaPermissionClient() {
                try {
                    final WebView webView = bridge.getWebView();
                    webView.setWebChromeClient(new BridgeWebChromeClient(bridge) {
                        @Override
                        public void onPermissionRequest(final PermissionRequest request) {
                            // WebView calls this on the UI thread already
                            boolean needCamera = false, needMic = false;
                            for (String r : request.getResources()) {
                                if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) needCamera = true;
                                if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) needMic = true;
                            }
                            Log.d("TeamsMobile", "onPermissionRequest origin=" + request.getOrigin() + " camera=" + needCamera + " mic=" + needMic);
                            boolean ok = (!needCamera || has(Manifest.permission.CAMERA))
                                    && (!needMic || has(Manifest.permission.RECORD_AUDIO));
                            Toast.makeText(MainActivity.this, "perm req " + request.getOrigin() + " cam=" + needCamera + " mic=" + needMic + " held=" + ok, Toast.LENGTH_SHORT).show();
                            if (ok) {
                                request.grant(request.getResources());
                            } else if (permissionRequestInFlight) {
                                request.deny(); // system dialog already showing; page is reloaded after the answer
                            } else {
                                super.onPermissionRequest(request); // Capacitor's own prompt flow
                            }
                        }
                    });
                } catch (Throwable t) {
                    Log.e("TeamsMobile", "Could not install media permission client", t);
                }
            }

            private String pageHooksJs = null;

            private String readAsset(String name) {
                try (InputStream in = getAssets().open(name); ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                    byte[] buf = new byte[4096];
                    int n;
                    while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                    return out.toString("UTF-8");
                } catch (Exception e) {
                    Log.e("TeamsMobile", "Could not read asset " + name, e);
                    return null;
                }
            }

            // Injects assets/page-hooks.js at the very start of every page/frame load (before Teams' own scripts run).
            private boolean installPageHooks() {
                try {
                    pageHooksJs = readAsset("page-hooks.js");
                    if (pageHooksJs == null) return false;
                    if (!WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) return false;
                    WebViewCompat.addDocumentStartJavaScript(bridge.getWebView(), pageHooksJs, Collections.singleton("*"));
                    return true;
                } catch (Throwable t) {
                    Log.e("TeamsMobile", "Could not install page hooks", t);
                    return false;
                }
            }

            private boolean has(String permission) {
                return ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED;
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                // Android Back: close dialogs / go back in Teams instead of closing the app
                getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                    @Override
                    public void handleOnBackPressed() {
                        handleBack();
                    }
                });

                // Keep the focused field visible above the keyboard (helps password autofill)
                getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);

                // Ask for camera/mic up-front, so they are already granted when Teams probes devices.
                List<String> missing = new ArrayList<>();
                if (!has(Manifest.permission.CAMERA)) missing.add(Manifest.permission.CAMERA);
                if (!has(Manifest.permission.RECORD_AUDIO)) missing.add(Manifest.permission.RECORD_AUDIO);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !has(Manifest.permission.BLUETOOTH_CONNECT)) {
                    missing.add(Manifest.permission.BLUETOOTH_CONNECT);
                }
                if (!missing.isEmpty()) {
                    permissionRequestInFlight = true;
                    ActivityCompat.requestPermissions(this, missing.toArray(new String[0]), MEDIA_PERMISSION_REQUEST);
                }

                installMediaPermissionClient();
                installPageHooks();

                // TEMPORARY: allows chrome://inspect on the phone to debug Teams. Remove once media works.
                WebView.setWebContentsDebuggingEnabled(true);

                this.bridge.getWebView().post(new Runnable() {
                    @Override
                    public void run() {
                        final WebView webView = bridge.getWebView();
                        WebSettings settings = webView.getSettings();

                        String desktopUA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36";
                        settings.setUserAgentString(desktopUA);

                        settings.setJavaScriptEnabled(true);
                        settings.setDomStorageEnabled(true);
                        settings.setDatabaseEnabled(true);
                        settings.setSavePassword(true);
                        settings.setSaveFormData(true);

                        // Use the system autofill framework (Google / Samsung / Bitwarden...) for login fields
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                            webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);
                        }
                        webView.setFocusable(true);
                        webView.setFocusableInTouchMode(true);

                        // Let remote call audio / ringtones play without a tap
                        settings.setMediaPlaybackRequiresUserGesture(false);

                        CookieManager cookieManager = CookieManager.getInstance();
                        cookieManager.setAcceptCookie(true);
                        cookieManager.setAcceptThirdPartyCookies(webView, true);
                        cookieManager.flush();

                        final String heavyCSSInjection =
                            "(function() {" +
                            "  var id = 'custom-teams-margins';" +
                            "  if (document.getElementById(id)) return;" +
                            "  var style = document.createElement('style');" +
                            "  style.id = id;" +
                            "  style.type = 'text/css';" +
                            "  style.innerHTML = '" +
                            "    body, html, #app-container, .app-width, #main-layout-id { zoom: 0.85 !important; }" +
                            "    .v2-left-rail, [data-test-id=\"left-rail\"], div[class*=\"leftRail\"] {" +
                            "      width: 50px !important; min-width: 50px !important;" +
                            "    }" +
                            "    .download-app-banner, .mobile-promo { display: none !important; }" +
                            "  ';" +
                            "  document.head.appendChild(style);" +
                            "})();";

                        final Handler handler = new Handler(Looper.getMainLooper());
                        for (int i = 0; i < 10; i++) {
                            handler.postDelayed(new Runnable() {
                                @Override
                                public void run() {
                                    webView.evaluateJavascript(heavyCSSInjection, null);
                                }
                            }, i * 1500);
                        }

                        // Fallback for the very first page load (document-start script may miss it): inject the same
                        // idempotent script a few times during the first 30 s.
                        if (pageHooksJs != null) {
                            for (int k = 1; k <= 10; k++) {
                                handler.postDelayed(new Runnable() {
                                    @Override
                                    public void run() {
                                        webView.evaluateJavascript(pageHooksJs, null);
                                    }
                                }, k * 3000);
                            }
                        }

                        if (DIAG) {
                            for (int delay : new int[]{15000, 45000}) {
                                handler.postDelayed(new Runnable() {
                                    @Override
                                    public void run() {
                                        webView.evaluateJavascript(DIAG_JS, null);
                                    }
                                }, delay);
                            }
                        }
                    }
                });
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == MEDIA_PERMISSION_REQUEST) {
                    permissionRequestInFlight = false;
                    // Teams probed devices before the permissions existed, so make it probe again
                    if (has(Manifest.permission.CAMERA) || has(Manifest.permission.RECORD_AUDIO)) {
                        bridge.getWebView().reload();
                    }
                }
            }

            @Override
            public void onPause() {
                super.onPause();
                CookieManager.getInstance().flush();
            }

            @Override
            public void onStop() {
                super.onStop();
                persistSessionCookies();
            }
        }
        EOF

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign APK Natively using Android SDK Tools
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
        ZIPALIGN_PATH=$(find $ANDROID_HOME/build-tools/ -name zipalign | sort -V | tail -n 1)
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
        $ZIPALIGN_PATH -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk teams-aligned.apk
        $APKSIGNER_PATH sign --ks release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out teams-desktop-pwa-release.apk teams-aligned.apk
        rm release.jks

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teams-desktop-pwa-release-signed-apk
        path: teams-desktop-pwa-release.apk
