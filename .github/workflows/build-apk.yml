name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install

    - name: Generate Native Android Project Fresh
      run: |
        # 1. Clear out any pre-existing broken android folder tracks to prevent collisions
        rm -rf android
        
        # 2. Setup the dummy web assets folder required structurally by the engine
        mkdir -p www
        echo '<!DOCTYPE html><html><head><title>Teams</title></head><body>Loading...</body></html>' > www/index.html
        
        # 3. Initialize the tool configuration properties mapping
        npx cap init "Teams Desktop PWA" "com.custom.teamsdesktop" --web-dir=www
        
        # 4. Generate the complete android platform directory framework including gradlew files
        npx cap add android
        npx cap sync android

    - name: Install App Icon
      run: |
        # icons/res holds pre-rendered launcher icons (all densities + adaptive icon) committed to the repo
        test -d icons/res || { echo "icons/res folder is missing"; exit 1; }
        RES=android/app/src/main/res
        # remove template launcher icons in other formats so they cannot clash with ours
        find "$RES" -name 'ic_launcher*.webp' -delete
        cp -r icons/res/. "$RES"/
        echo "Installed icons:"; find "$RES" -name 'ic_launcher*' -o -name 'teams_icon*' | sort

    - name: Add Permissions and Foreground Service to AndroidManifest
      run: |
        MANIFEST=android/app/src/main/AndroidManifest.xml

        # Runtime permissions: Capacitor's WebChromeClient asks for CAMERA / RECORD_AUDIO when Teams calls getUserMedia().
        # BLUETOOTH_CONNECT routes call audio to BT headsets (Android 12+), POST_NOTIFICATIONS shows notifications (Android 13+).
        # The FOREGROUND_SERVICE* permissions and WAKE_LOCK are for keeping calls and the session alive in the background.
        sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>#' "$MANIFEST"

        # Foreground service that keeps the session / calls alive
        sed -i 's#</application>#        <service android:name=".TeamsForegroundService" android:exported="false" android:foregroundServiceType="dataSync|microphone|camera|specialUse">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Keeps the Teams web session alive in the background for messages and calls" />\n        </service>\n    </application>#' "$MANIFEST"

        echo "---- Resulting manifest ----"
        cat "$MANIFEST"
        grep -q "android.permission.RECORD_AUDIO" "$MANIFEST" || { echo "Permission patch failed"; exit 1; }
        grep -q "TeamsForegroundService" "$MANIFEST" || { echo "Service patch failed"; exit 1; }

    - name: Add Page Hooks Script and androidx.webkit Dependency
      run: |
        # JS that runs at document start in every frame: camera/mic permission state + client-hints fix (needs androidx.webkit)
        mkdir -p android/app/src/main/assets
        cat << 'JSEOF' > android/app/src/main/assets/page-hooks.js
        (function () {
          'use strict';
          if (window.__teamsHooks) return;
          window.__teamsHooks = true;
          var NATIVE_UACH = __NATIVE_UACH__; // replaced by MainActivity before injection

          var IS_TEAMS = /^teams\.(cloud\.microsoft|microsoft\.com)$/.test(location.hostname);
          var IS_TOP = (window === window.top);

          // Talks to the Android app (only exists on the Teams origins, see MainActivity.installNativeBridge)
          function post(message) {
            try {
              if (window.TeamsNative && typeof window.TeamsNative.postMessage === 'function') {
                window.TeamsNative.postMessage(JSON.stringify(message));
              }
            } catch (e) {}
          }

          // Teams' service worker fails on reload in WebView on some devices (first load works, every later load ends in
          // net::ERR_FAILED). Hide service workers from the page and unregister existing ones so Teams loads from the network.
          // Set to false to turn this off again.
          var DISABLE_SERVICE_WORKER = true;
          if (DISABLE_SERVICE_WORKER) {
            try {
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  rs.forEach(function (r) { r.unregister(); });
                }).catch(function () {});
              }
              delete Navigator.prototype.serviceWorker;
            } catch (e) {}
          }

          // WebView always reports camera/microphone permission as 'prompt' (it does not remember grants),
          // which makes Teams think access is missing. Android's real permission still decides whether
          // getUserMedia succeeds, so we only change what the page reads here. Same for notifications on Teams
          // (they are delivered through the Android app, see below).
          try {
            var P = window.Permissions && window.Permissions.prototype;
            if (P && P.query) {
              var originalQuery = P.query;
              P.query = function (descriptor) {
                var name = descriptor && descriptor.name;
                var overridden = (name === 'microphone' || name === 'camera' || (IS_TEAMS && name === 'notifications'));
                return originalQuery.apply(this, arguments).then(function (status) {
                  if (overridden) {
                    try { Object.defineProperty(status, 'state', { get: function () { return 'granted'; } }); } catch (e) {}
                  }
                  return status;
                });
              };
            }
          } catch (e) {}

          // Camera in portrait: Teams shows the self-view and sends the video in a fixed 16:9 box, but in portrait the phone's
          // camera delivers portrait frames, which end up stretched. So in portrait the camera picture is drawn into a 16:9
          // canvas and that stream is handed to Teams instead (the picture keeps its proportions; 'contain' = whole picture
          // with black side bars, 'cover' = fills the box and crops top and bottom). Landscape is left untouched.
          // Set FIX_PORTRAIT_VIDEO to false to turn this off again.
          var FIX_PORTRAIT_VIDEO = true;
          var VIDEO_FIT = 'contain';
          var OUT_W = 1280, OUT_H = 720;
          var capturedTracks = [];

          function isPortrait() {
            try { return window.matchMedia('(orientation: portrait)').matches; } catch (e) { return false; }
          }

          function letterboxStream(stream) {
            return new Promise(function (resolve) {
              var origTrack = stream.getVideoTracks && stream.getVideoTracks()[0];
              if (!origTrack || !FIX_PORTRAIT_VIDEO || !isPortrait() ||
                  !window.HTMLCanvasElement || !window.HTMLCanvasElement.prototype.captureStream) {
                resolve(stream);
                return;
              }
              var source, canvas, ctx, outTrack, timer = 0, settled = false;

              function draw() {
                var w = source.videoWidth, h = source.videoHeight;
                if (!w || !h) return;
                var scale = (VIDEO_FIT === 'cover') ? Math.max(OUT_W / w, OUT_H / h) : Math.min(OUT_W / w, OUT_H / h);
                var dw = w * scale, dh = h * scale;
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, OUT_W, OUT_H);
                ctx.drawImage(source, (OUT_W - dw) / 2, (OUT_H - dh) / 2, dw, dh);
              }

              function ready() {
                if (settled) return;
                settled = true;
                draw();
                timer = setInterval(draw, 33);

                var stopOut = outTrack.stop.bind(outTrack);
                var baseSettings = outTrack.getSettings.bind(outTrack);
                outTrack.stop = function () {
                  clearInterval(timer);
                  try { origTrack.stop(); } catch (e) {}
                  stopOut();
                };
                outTrack.getSettings = function () {
                  var s = {};
                  try { s = origTrack.getSettings(); } catch (e) {}
                  var own = baseSettings();
                  s.width = OUT_W; s.height = OUT_H; s.aspectRatio = OUT_W / OUT_H;
                  if (own && own.frameRate) s.frameRate = own.frameRate;
                  return s;
                };
                try { Object.defineProperty(outTrack, 'label', { get: function () { return origTrack.label; } }); } catch (e) {}
                outTrack.getCapabilities = function () { try { return origTrack.getCapabilities(); } catch (e) { return {}; } };
                outTrack.applyConstraints = function (c) { try { return origTrack.applyConstraints(c); } catch (e) { return Promise.resolve(); } };
                origTrack.addEventListener('ended', function () {
                  clearInterval(timer);
                  try { stopOut(); outTrack.dispatchEvent(new Event('ended')); } catch (e) {}
                });

                resolve(new MediaStream(stream.getAudioTracks().concat([outTrack])));
              }

              try {
                source = document.createElement('video');
                source.muted = true;
                source.playsInline = true;
                source.addEventListener('loadeddata', ready);
                source.addEventListener('resize', ready);
                source.srcObject = new MediaStream([origTrack]);
                canvas = document.createElement('canvas');
                canvas.width = OUT_W;
                canvas.height = OUT_H;
                ctx = canvas.getContext('2d');
                outTrack = canvas.captureStream(30).getVideoTracks()[0];
                var p = source.play();
                if (p && p.catch) p.catch(function () {});
              } catch (e) { settled = true; resolve(stream); return; }

              setTimeout(function () {
                if (settled) return;
                settled = true; // no frame in time: hand over the camera as it is
                try { source.srcObject = null; outTrack.stop(); } catch (e) {}
                resolve(stream);
              }, 2000);
            });
          }

          try {
            var MDP = window.MediaDevices && window.MediaDevices.prototype;
            if (MDP && MDP.getUserMedia) {
              var originalGetUserMedia = MDP.getUserMedia;
              MDP.getUserMedia = function () {
                return originalGetUserMedia.apply(this, arguments).then(function (stream) {
                  return letterboxStream(stream).then(function (result) {
                    try { result.getTracks().forEach(function (t) { capturedTracks.push(t); }); } catch (e) {}
                    return result;
                  });
                });
              };
            }
          } catch (e) {}

          // Client hints: when the native WebView API could not set them (NATIVE_UACH false), fake them for page scripts.
          // Otherwise the native metadata already makes headers and navigator.userAgentData agree with the desktop user-agent.
          if (!NATIVE_UACH) try {
            var uaMatch = /Chrome\/(\d+)/.exec(navigator.userAgent);
            var major = uaMatch ? uaMatch[1] : '157'; // follow the real WebView version, never hardcode
            var brands = [{ brand: 'Chromium', version: major }, { brand: 'Google Chrome', version: major }, { brand: 'Not A(Brand)', version: '99' }];
            var full = [{ brand: 'Chromium', version: major + '.0.0.0' }, { brand: 'Google Chrome', version: major + '.0.0.0' }, { brand: 'Not A(Brand)', version: '99.0.0.0' }];
            var uad = {
              brands: brands, mobile: false, platform: 'Linux',
              getHighEntropyValues: function () {
                return Promise.resolve({ brands: brands, mobile: false, platform: 'Linux', platformVersion: '6.5.0', architecture: 'x86', bitness: '64', model: '', uaFullVersion: major + '.0.0.0', fullVersionList: full, wow64: false });
              },
              toJSON: function () { return { brands: brands, mobile: false, platform: 'Linux' }; }
            };
            Object.defineProperty(Navigator.prototype, 'userAgentData', { get: function () { return uad; }, configurable: true });
          } catch (e) {}

          if (!IS_TEAMS) return;

          // Notifications: Android WebView has no Notification API (and no push). Teams calls "new Notification(...)" while
          // the page is hidden; hand those to the Android app, which shows a real notification.
          // DEBUG_NOTIFICATIONS (temporary): shows a short on-screen message in the app for each notification-related thing
          // Teams does.
          var DEBUG_NOTIFICATIONS = true;
          var debugSeen = {};
          function debug(text, always) {
            if (!DEBUG_NOTIFICATIONS) return;
            if (!always && debugSeen[text]) return;
            debugSeen[text] = true;
            post({ type: 'debug', text: text });
          }
          try {
            var FakeNotification = function (title, options) {
              options = options || {};
              this.title = String(title || '');
              this.body = String(options.body || '');
              this.tag = String(options.tag || '');
              this.data = options.data;
              this.onclick = null; this.onclose = null; this.onerror = null; this.onshow = null;
              debug('Notification created: ' + this.title.slice(0, 30), true);
              post({ type: 'notify', title: this.title, body: this.body, tag: this.tag });
              var self = this;
              setTimeout(function () { if (typeof self.onshow === 'function') { try { self.onshow({}); } catch (e) {} } }, 0);
            };
            FakeNotification.prototype.close = function () {};
            FakeNotification.prototype.addEventListener = function () {};
            FakeNotification.prototype.removeEventListener = function () {};
            FakeNotification.prototype.dispatchEvent = function () { return true; };
            Object.defineProperty(FakeNotification, 'permission', {
              get: function () { debug('Notification.permission was read'); return 'granted'; }
            });
            FakeNotification.requestPermission = function (callback) {
              debug('Notification.requestPermission was called');
              if (typeof callback === 'function') callback('granted');
              return Promise.resolve('granted');
            };
            FakeNotification.maxActions = 0;
            window.Notification = FakeNotification;
          } catch (e) {}

          // Teams does not create browser notifications in this WebView (it only checks the permission), but it keeps the unread
          // count in the page title up to date, e.g. "(2) Chat | Microsoft Teams". When that count grows, show a notification
          // (with the text of Teams' own in-page banner when there is one).
          if (IS_TOP) {
            var lastUnread = null;
            var unreadOf = function (title) {
              var m = /^\s*\((\d+)\+?\)/.exec(title) || /\((\d+)\+?\)/.exec(title);
              return m ? parseInt(m[1], 10) : 0;
            };
            var describeActivity = function () {
              try {
                var nodes = document.querySelectorAll('[role="alert"],[data-tid*="toast"],[data-tid*="notification"]');
                for (var i = 0; i < nodes.length; i++) {
                  var text = (nodes[i].innerText || '').replace(/\s+/g, ' ').trim();
                  if (text.length > 3) return text.slice(0, 160);
                }
              } catch (e) {}
              return '';
            };
            var onTitleChange = function () {
              var title = document.title || '';
              var unread = unreadOf(title);
              if (/\(\d+\+?\)/.test(title)) debug('title: ' + title.slice(0, 40));
              if (lastUnread !== null && unread > lastUnread) {
                var detail = describeActivity();
                debug('unread ' + lastUnread + ' -> ' + unread + (detail ? ': ' + detail.slice(0, 40) : ''), true);
                post({ type: 'notify', title: 'Microsoft Teams', body: detail || (unread + ' unread'), tag: 'unread' });
              }
              lastUnread = unread;
            };
            var watchTitle = function () {
              var el = document.querySelector('title');
              if (!el) { setTimeout(watchTitle, 1000); return; }
              onTitleChange();
              new MutationObserver(onTitleChange).observe(el, { childList: true, characterData: true, subtree: true });
            };
            watchTitle();
            document.addEventListener('visibilitychange', function () {
              debug('page is ' + document.visibilityState + ', focus: ' + document.hasFocus(), true);
            });
          }

          // Calls: tell the Android app when a call is active (microphone/camera captured, or remote media playing), so it
          // can keep the call alive in the background (foreground service). Going inactive is reported after 8 s of silence.
          if (IS_TOP) {
            var callActive = false;
            var inactiveSince = 0;

            var captureLive = function () {
              capturedTracks = capturedTracks.filter(function (t) { return t.readyState === 'live'; });
              return capturedTracks.length > 0;
            };
            var remoteMediaPlaying = function () {
              var els = document.querySelectorAll('audio,video');
              for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (el.srcObject && typeof el.srcObject.getTracks === 'function' && !el.paused && !el.ended) return true;
              }
              return false;
            };

            setInterval(function () {
              var active = captureLive() || remoteMediaPlaying();
              var now = Date.now();
              if (active) {
                inactiveSince = 0;
                if (!callActive) { callActive = true; post({ type: 'call', active: true }); }
              } else if (callActive) {
                if (!inactiveSince) inactiveSince = now;
                if (now - inactiveSince > 8000) { callActive = false; post({ type: 'call', active: false }); }
              }
            }, 2000);
          }
        })();
        JSEOF

        GRADLE=android/app/build.gradle
        sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.webkit:webkit:1.12.1"/' "$GRADLE"
        grep -n "androidx.webkit" "$GRADLE" || { echo "Could not add androidx.webkit dependency"; exit 1; }

    - name: Add Foreground Service Java Code
      run: |
        cat << 'SVCEOF' > android/app/src/main/java/com/custom/teamsdesktop/TeamsForegroundService.java
        package com.custom.teamsdesktop;

        import android.Manifest;
        import android.annotation.SuppressLint;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.PendingIntent;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.content.pm.ServiceInfo;
        import android.os.Build;
        import android.os.IBinder;
        import android.os.PowerManager;
        import androidx.core.app.NotificationCompat;
        import androidx.core.app.NotificationManagerCompat;
        import androidx.core.content.ContextCompat;

        /**
         * Keeps the app process (and with it the Teams web page) alive while the app is in the background, so messages
         * arrive and calls continue. During a call it also declares the microphone/camera foreground service types, which
         * Android requires for capturing audio/video in the background.
         */
        public class TeamsForegroundService extends Service {
            static final String ACTION_START = "com.custom.teamsdesktop.action.START";
            static final String ACTION_CALL_ON = "com.custom.teamsdesktop.action.CALL_ON";
            static final String ACTION_CALL_OFF = "com.custom.teamsdesktop.action.CALL_OFF";
            static final String ACTION_QUIT = "com.custom.teamsdesktop.action.QUIT";

            private static final String CHANNEL_BACKGROUND = "teams_background";
            private static final String CHANNEL_MESSAGES = "teams_messages";
            private static final int NOTIFICATION_ID = 1001;

            // Set by MainActivity: keep the service running even when there is no call
            static volatile boolean keepAlive = true;

            private boolean inCall = false;
            private PowerManager.WakeLock wakeLock = null;

            static void send(Context context, String action) {
                try {
                    Intent intent = new Intent(context, TeamsForegroundService.class).setAction(action);
                    ContextCompat.startForegroundService(context, intent);
                } catch (Throwable ignored) {
                    // Android refuses to start it right now (for example the app is in the background): keep the current state
                }
            }

            static int immutableFlag() {
                return Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
            }

            static Intent openIntent(Context context) {
                return new Intent(context, MainActivity.class)
                    .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
            }

            static void ensureChannel(Context context, String id, String name, int importance) {
                if (Build.VERSION.SDK_INT >= 26) {
                    NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                    if (nm != null && nm.getNotificationChannel(id) == null) {
                        nm.createNotificationChannel(new NotificationChannel(id, name, importance));
                    }
                }
            }

            /** Shows a message notification (called from MainActivity while the app is not in the foreground). */
            @SuppressLint("MissingPermission")
            static void showMessage(Context context, String title, String body, String tag) {
                try {
                    if (Build.VERSION.SDK_INT >= 33
                            && ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        return;
                    }
                    ensureChannel(context, CHANNEL_MESSAGES, "Messages and meetings", NotificationManager.IMPORTANCE_HIGH);
                    PendingIntent open = PendingIntent.getActivity(context, 2, openIntent(context),
                        immutableFlag() | PendingIntent.FLAG_UPDATE_CURRENT);
                    String key = (tag != null && !tag.isEmpty()) ? tag : title;
                    int id = 2000 + Math.abs(key.hashCode() % 1000);
                    Notification notification = new NotificationCompat.Builder(context, CHANNEL_MESSAGES)
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setContentTitle(title.isEmpty() ? "Teams" : title)
                        .setContentText(body)
                        .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                        .setContentIntent(open)
                        .setAutoCancel(true)
                        .setPriority(NotificationCompat.PRIORITY_HIGH)
                        .build();
                    NotificationManagerCompat.from(context).notify(id, notification);
                } catch (Throwable ignored) {
                    // notifications are best-effort
                }
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                String action = intent != null ? intent.getAction() : null;
                if (ACTION_CALL_ON.equals(action)) inCall = true;
                else if (ACTION_CALL_OFF.equals(action)) inCall = false;

                // startForeground() must follow every startForegroundService(), even if we stop again right after
                boolean promoted = promote();
                if (!promoted || (!keepAlive && !inCall)) {
                    releaseWakeLock();
                    stopForeground(true);
                    stopSelf();
                    return START_NOT_STICKY;
                }
                updateWakeLock();
                return START_NOT_STICKY;
            }

            @Override
            public void onDestroy() {
                releaseWakeLock();
                super.onDestroy();
            }

            private boolean has(String permission) {
                return ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED;
            }

            private boolean startAs(Notification notification, int type) {
                try {
                    if (Build.VERSION.SDK_INT >= 29) {
                        startForeground(NOTIFICATION_ID, notification, type);
                    } else {
                        startForeground(NOTIFICATION_ID, notification);
                    }
                    return true;
                } catch (RuntimeException e) {
                    return false;
                }
            }

            private boolean promote() {
                Notification notification = buildNotification();
                int baseType = 0;
                if (Build.VERSION.SDK_INT >= 34) {
                    baseType = ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE;
                } else if (Build.VERSION.SDK_INT >= 29) {
                    baseType = ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC;
                }
                if (inCall && Build.VERSION.SDK_INT >= 30) {
                    int callType = baseType;
                    if (has(Manifest.permission.RECORD_AUDIO)) callType |= ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                    if (has(Manifest.permission.CAMERA)) callType |= ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA;
                    if (startAs(notification, callType)) return true;
                    // Android only allows these types while the app is visible; fall back to the plain background type
                }
                return startAs(notification, baseType);
            }

            private Notification buildNotification() {
                ensureChannel(this, CHANNEL_BACKGROUND, "Background connection", NotificationManager.IMPORTANCE_LOW);
                PendingIntent open = PendingIntent.getActivity(this, 0, openIntent(this),
                    immutableFlag() | PendingIntent.FLAG_UPDATE_CURRENT);
                Intent quitIntent = new Intent(this, MainActivity.class).setAction(ACTION_QUIT)
                    .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                PendingIntent quit = PendingIntent.getActivity(this, 1, quitIntent,
                    immutableFlag() | PendingIntent.FLAG_UPDATE_CURRENT);
                return new NotificationCompat.Builder(this, CHANNEL_BACKGROUND)
                    .setSmallIcon(inCall ? android.R.drawable.stat_sys_phone_call : android.R.drawable.stat_notify_chat)
                    .setContentTitle(inCall ? "Teams call in progress" : "Teams is running")
                    .setContentText(inCall ? "Tap to return to the call" : "Keeping your session alive for messages and calls")
                    .setContentIntent(open)
                    .addAction(0, "Quit", quit)
                    .setOngoing(true)
                    .setOnlyAlertOnce(true)
                    .setCategory(inCall ? NotificationCompat.CATEGORY_CALL : NotificationCompat.CATEGORY_SERVICE)
                    .setPriority(NotificationCompat.PRIORITY_LOW)
                    .build();
            }

            private void updateWakeLock() {
                try {
                    if (inCall) {
                        if (wakeLock == null) {
                            PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                            wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "teamsdesktop:call");
                            wakeLock.setReferenceCounted(false);
                        }
                        if (!wakeLock.isHeld()) wakeLock.acquire(4 * 60 * 60 * 1000L);
                    } else {
                        releaseWakeLock();
                    }
                } catch (Throwable ignored) {
                    // the call still works, the CPU may just sleep when the screen is off
                }
            }

            private void releaseWakeLock() {
                try {
